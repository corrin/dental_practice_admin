[project]
name = "dental-practice-admin"
version = "0.1.0"
description = "Administrative application for Principle Dental at one dental practice"
requires-python = ">=3.14,<3.15"
dependencies = [
    "authlib>=1.8.0",
    "fastapi>=0.142.2",
    "httpx>=0.28,<0.29",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jsonschema==4.26.0",
    "openai-agents>=0.22.3",
    "openai-chatkit>=1.6.5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dental-practice-admin = "dental_practice_admin.tasks:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pyyaml>=6.0,<7",
    "ruff>=0.14,<0.15",
    "mypy>=1.13,<2",
    "pytest-playwright>=0.9.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_practice_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The default suite is hermetic: no credentials, no network, safe in CI. The integration
# tier is a release gate run deliberately (scripts/run_integration_tests.ps1), never a
# default, because it reaches the real staging tenant.
addopts = "-m 'not integration and not ui and not e2e and not smoke and not llm' --strict-markers"
markers = [
    "integration: reaches the real Principle staging API; refuses rather than skips when unconfigured",
    "ui: drives the real Principle web UI with Playwright",
    "e2e: runs the fake, the task and the web application as separate processes, in a browser",
    "smoke: loads every page in a real browser and fails on any console error; needs internet",
    "llm: calls the real OpenAI API; costs money, proves the wire format",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D401", "D102", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
# src is the package root; without these mypy reads src/dental_practice_admin/*.py twice, once
# as a top-level module and once through the installed package.
mypy_path = "src"
explicit_package_bases = true

# authlib ships no type information. The OAuth surface we touch is three calls, all in
# auth.py, and none of them is checkable from stubs that do not exist.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
