[project]
name = "principle-admin"
version = "0.1.0"
description = "Administrative application for Principle Dental at one dental practice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
principle-admin = "principle_admin.tasks:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pyyaml>=6.0,<7",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/principle_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# The default suite is hermetic: no credentials, no network, safe in CI. The integration
# tier is a release gate run deliberately (scripts/run_integration_tests.ps1), never a
# default, because it reaches the real staging tenant.
addopts = "-m 'not integration and not ui' --strict-markers"
markers = [
    "integration: reaches the real Principle staging API; refuses rather than skips when unconfigured",
    "ui: drives the real Principle web UI with Playwright",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D401", "D102", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# src is the package root; without these mypy reads src/principle_admin/*.py twice, once
# as a top-level module and once through the installed package.
mypy_path = "src"
explicit_package_bases = true
