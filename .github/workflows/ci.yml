name: CI

# Windows only. The production host is Windows, and the failures worth catching here -- path
# handling, the missing IANA tz database, subprocess and Playwright behaviour -- do not
# reproduce on Linux.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Changes only to documentation or the server install script can't affect the tests, so they
  # skip them. A job skipped by its condition counts as passed for the required `hermetic` check,
  # so hermetic runs whenever this job didn't succeed. deploy/ is tested (test_deploy_files.py).
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!scripts/install_server.ps1'

  hermetic:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: uv sync --frozen

      # Both browsers (the MCP server's chrome-for-testing and Python Playwright's chromium) live
      # in ms-playwright; the lock files pin both Playwright versions, so they key the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'uv.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          node node_modules/@playwright/mcp/cli.js install-browser chrome-for-testing
          uv run playwright install chromium

      - name: Lint
        run: uv run ruff check .

      - name: Released Principle interface
        run: uv run python -m scripts.refresh_spec --check

      - name: Types
        run: uv run mypy

      - name: Unit and fake tiers
        run: uv run pytest -q

      - name: End-to-end (fake Principle, task and web application as separate processes)
        run: uv run pytest -m e2e -q

      - name: Code size
        run: uv run python -m scripts.code_size

  # Every change to main that passes becomes a release the server installs with
  # scripts/install_server.ps1. Nothing is built on the server.
  release:
    needs: [changes, hermetic]
    if: ${{ github.event_name == 'push' && !cancelled() && needs.hermetic.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build
        shell: powershell
        run: scripts\build_release.ps1

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content build\release\RELEASE -Raw).Trim()
          gh release create $tag build\dental-practice-admin.zip scripts\install_server.ps1 --target $env:GITHUB_SHA --title "Release $tag" --notes "Commit $env:GITHUB_SHA" --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

# The integration tier is deliberately absent: it needs staging credentials, and CI stays
# hermetic. It is a release gate, run from a machine that holds them
# (scripts/run_integration_tests.ps1).
