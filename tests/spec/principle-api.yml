webhooks:
  principleWebhook:
    post:
      summary: Outbound events for partner integrations
      description: |
        This webhook is called whenever Principle Dental has an event to notify.

          The payload includes `eventType`, a `timestamp`, and a `data` object
          representing the resource.

          **Security**:

          - The request is signed with an HMAC signature in the
          `X-Principle-Signature` header.
          - The request is sent with the timestamp in the `X-Principle-Timestamp`
          header.
          - The signature is computed based on the combination of the
          `X-Principle-Timestamp` and the raw JSON body using a shared secret.
          - The shared secret is provided when you register the webhook.


          **Signature verification**:

          - To verify the signature, compute the HMAC SHA256 hash of the timestamp and
          the request body using the shared secret.
          - Compare the computed hash with the signature in the
          `X-Principle-Signature` header.
          - If they match, the request is valid and you can process the payload.
          - If they do not match, the request is invalid and you should respond with a
          400 Bad Request.
          - The timestamp is in ISO 8601 format (e.g., `2025-01-01T12:00:00Z`).

          **Javascript Example**:

          ```javascript
          import * as Crypto from 'crypto';

          const timestamp = req.headers['X-Principle-Timestamp'];
          const signature = req.headers['X-Principle-Signature'];
          const hash = `${timestamp}.${rawData}`;
          const webhookSecret = 'xxxxxxxxxxx'; // Replace with your webhook secret

          const signedHash = Crypto.createHmac('sha256', webhookSecret)
            .update(hash)
            .digest('hex');
          const isValid = signedHash === signature;
          ```

          **Retries**:

          - If the webhook fails to respond with a 200 OK status, Principle Dental
          will retry the request up to 20 times.
          - The webhook will timeout after 20 seconds, at which point it will be
          considered a failure.
          - The webhook will be retried every minute until it succeeds or the retry
          limit is reached.
          - If the webhook fails after 20 retries, it will be marked as disabled which
          will need to be manually re-enabled via the Partner Portal.

          **Important**:

          Ensure that your webhook endpoint is capable of handling retries and
          idempotency. We have an at least once delivery guarantee, meaning that you
          may receive the same event multiple times.

          **Possible event types**:

          - `patient.created`
          - `patient.updated`
          - `invoice.created`
          - `invoice.updated`
          - etc...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
            examples:
              default:
                $ref: '#/components/examples/WebhookInbound'
      responses:
        '200':
          description: Webhook received successfully.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Provide your API key in the `X-API-Key` header to authenticate.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.principle.dental/oauth/authorize
          tokenUrl: https://api.principle.dental/oauth/token
          refreshUrl: https://api.principle.dental/oauth/refresh
          scopes:
            patients:read: Read patient data
            patients:write: Write patient data
            appointments:read: Read appointment data including online booking requests
            appointments:write: Write appointment data including online booking requests
            accounts:read: Read account data including invoices / transactions / deposits
            accounts:write: Write account data including invoices / transactions / deposits
            files:read: Read patient file data
            files:write: Write patient file data
            messages:read: Read message data
            messages:write: Write message data
            interactions:write: Write interaction data for patients / appointments
            notifications:write: Write notification data
            emails:read: Read email data
            emails:write: Write email data
            tags:read: Read tag data
            tags:write: Write tag data
            practices:read: Read practice data
            availability:read: Read availability data including appointment search helpers
            treatment-plans:read: Read treatment plans, steps, and treatments
            treatment-plans:write: Write treatment plans, steps, and treatments
  responses:
    BadRequestError:
      description: Bad Request - invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/BadRequestError'
    ConflictError:
      description: Conflict – the requested time overlaps another booking
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            timeslotConflict:
              summary: Overlapping booking
              value:
                error: conflict
                message: |
                  The practitioner already has an appointment from 2025-04-01T09:00 to 2025-04-01T09:30.
                statusCode: 409
    ForbiddenError:
      description: Forbidden - caller is not authorised for this practice
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenError'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/NotFoundError'
    UnauthorisedError:
      description: |
        Unauthorised – the request lacks valid authentication
        credentials or the supplied access token is invalid /
        expired
      headers:
        WWW-Authenticate:
          description: "RFC\_6750 compliant challenge, e.g. `Bearer realm=\"principle\", error=\"invalid_token\", error_description=\"The access token expired\"`\n"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidToken:
              summary: Expired or malformed token
              value:
                error: invalid_token
                message: The access token provided is expired, revoked, malformed, or invalid
                statusCode: 401
            missingToken:
              summary: No Authorization header
              value:
                error: unauthorised
                message: Bearer token not supplied in Authorization header
                statusCode: 401
  schemas:
    AccountCredit:
