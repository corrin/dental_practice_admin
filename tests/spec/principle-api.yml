        externalId:
          type: string
          description: External identifier for deduplication
          example: call-20250301-001
        context:
          type: object
          description: |
            Contextual references linking this call event to practice resources.
            Either `patientId` or `leadId` must be provided; a request with neither is
            rejected with a 400 error. Any of `patientId`, `leadId`, `practitionerId`,
            `appointmentId`, or `invoiceId` that is supplied but cannot be resolved
            within the authenticated workspace is rejected with a 404 error.
          required:
            - practiceId
          properties:
            practiceId:
              type: string
              description: Practice identifier
              example: a610e3062
            patientId:
              type: string
              description: Existing patient ID. Either patientId or leadId is required.
              example: patient-123
            practitionerId:
              type: string
              description: Practitioner ID (optional).
              example: practitioner-456
            appointmentId:
              type: string
              description: Appointment ID (optional). Must reference an appointment tied to the given patientId/leadId.
              example: appointment-789
            invoiceId:
              type: string
              description: Invoice ID (optional). Must reference an invoice tied to the given patientId/leadId.
              example: invoice-012
            leadId:
              type: string
              description: Lead ID. Either patientId or leadId is required.
              example: lead-456
