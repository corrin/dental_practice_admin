          example: Primary Webhook for Invoice Notifications
        endpointUrl:
          type: string
          format: uri
          description: The callback URL where events will be sent
          example: https://partner-app.com/webhook
        events:
          type: array
          description: List of event types this webhook should receive
          items:
            $ref: '#/components/schemas/WebhookEvent'
        secret:
          type: string
          description: |
            Optional secret for HMAC signing. If provided, the server uses this secret to sign requests in the `X-Principle-Signature` header.
        organisationId:
          type: string
          description: Unique identifier for the organisation associated with this webhook
          example: aA22bB33
        practiceIds:
          type: array
          items:
            type: string
          description: List of practice IDs this webhook is associated with
          example:
            - a610e3062
            - b48da97a
        status:
          type: string
          enum:
            - enabled
            - disabled
          description: Whether this webhook is enabled or disabled
          example: enabled
        consecutiveFailures:
          type: integer
          minimum: 0
          description: |
            Number of consecutive failed webhook deliveries. Resets to 0 on any successful delivery. When this reaches 10, the webhook is automatically disabled and `disabledReason` is set to `consecutive_failures`.
          example: 0
        disabledReason:
          type: string
          enum:
            - consecutive_failures
          description: |
            Reason the webhook was disabled. Present with value `consecutive_failures` only when the webhook was auto-disabled after crossing the consecutive failure threshold. Absent for enabled webhooks and for manual disables.
          example: consecutive_failures
        description:
          type: string
          description: Optional description for your reference
        createdAt:
          type: string
          format: date-time
          description: Time when this webhook record was created
        updatedAt:
          type: string
          format: date-time
          description: Time when this webhook record was last updated
