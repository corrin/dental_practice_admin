openapi: 3.1.0
info:
  title: Principle Dental Practice Management API
  version: 1.1.0
  description: |
    This API allows partners to integrate with the Principle Dental Practice Management Software. It includes operations for managing Patients, Appointments, Invoices, Transactions, Deposits, Files, SMS Messages, Emails, Tags, Practices, and Treatment Options.

      <br />

      # API Key Authentication for Workspaces

      ### API Key at a glance 🔑

      Principle supports a simple **API Key** authentication scheme for Principle workspaces
      to build server-to-server integrations or back-office scripts where the OAuth 2.0 flow
      is not required. Every request just needs an `X-API-Key` HTTP header - no bearer token
      exchanges, no refresh cycles.

      <br />

      ## 1. Generate an API Key

      1. Sign in to Principle and open **Workspace Settings → Integrations**

      | Environment | URL |
      |-------------|-----|
      | **production** | https://app.principle.dental/settings/workspace/integrations |
      | **sandbox/staging** | https://staging.principle.dental/settings/workspace/integrations |


      2. Select the **API Keys & Webhooks** tab.

      3. Click **Add New API Key**.

      4. Fill in the form:

      | Field | Purpose |
      |-------|---------|
      | **Label** | Human-friendly name, e.g. *“Accounting Export Job”* |
      | **API Permissions** | The scopes this key may access - think “read / write” for each resource |
      | **Allowed Practices** | One or more Practices the key is restricted to |

      5. Hit **Create** - your key is displayed **once**. Copy it immediately and
        store it somewhere safe (e.g. a password manager or secret vault).

      > **Screenshot placeholders:**
      > `![Create an API Key](PLACEHOLDER_CREATE_API_KEY.png)`
      > `![Assign scopes & practices](PLACEHOLDER_UPDATE_API_KEY.png)`

      <br />

      ## 2. Use the Key in Requests


      ```http
      GET /v1/patients?practiceId=a610e3062 HTTP/1.1
      Host: api.principle.dental
      X-API-Key: sk_live_51Hj5c9…
      ```

      That's all there is - if the key is valid and has the required permission /
      practice access, the request succeeds. Otherwise the API responds with `401
      Unauthorized` or `403 Forbidden`.

      <br />

      ## 3. Rotating or Editing a Key

      Need to rename the key, change scopes, or add more practices later?

      * Go back to **Workspace Settings → Integrations → API Keys & Webhooks**.
      * Click the key's **⋯** menu → **Edit**.
      * Adjust **Label**, **API Permissions**, or **Allowed Practices** and **Save**.

      Changes take effect immediately; no code change is required on your side as the
      secret value itself does **not** change.

      <br />

      ## 4. Security Best Practices


      * Treat the key like a password - **never commit it to Git** or embed it in
        frontend code.

      * Rotate keys periodically and **delete** keys that are no longer in use.

      * Keep the scope set as small as possible (“least privilege”).

      * Use **IP allow-lists** or firewall rules on your servers where feasible.

      <br />

      ## 5. Error reference

      | HTTP | `error` | Fix |
      |------|---------|-----|
      | 401 | `unauthorized` | Header missing, malformed, or the key string is invalid |
      | 403 | `forbidden`    | Key is valid but lacks permission for this practice or resource. Update permissions. |

      <br /><br />

      # OAuth 2.0 Authentication for Partners

      > [!important] Partners are required to use the OAuth 2.0 flow over API Key authentication.

      ### OAuth 2.0 at a glance 🚀

      Principle uses the **OAuth 2.0 *Authorization-Code* flow + Refresh Tokens** so that:

      1. **Users grant** your partner-app limited access to their organisation / practices.
      2. **Your backend exchanges** that one-time **`code`** for a short-lived **access-token** (20 min), **and** a long-lived **refresh-token** (2 months).
      3. **You call the API** with the access-token in the `Authorization: Bearer …` header.
      4. **When the access-token expires** you silently swap the refresh-token for a new pair.
      5. **If the refresh-token has expired** (no activity for ≥ 2 months) you must send the user through the authorisation screen again.

      <br />

      ## 1. Send user to OAuth consent page

      Redirect (or open in a popup) the user's browser to:

      | Environment | URL |
      |-------------|-----|
      | **production** | https://principle.dental/oauth/authorize |
      | **sandbox/staging** | https://staging.principle.dental/oauth/authorize |

      with these **query parameters**:

      | Parameter | Example | Required | What it does |
      |-----------|---------|----------|--------------|
      | `response_type` | `code` | ✅ | Tells Principle you want the *Authorization-Code* flow |
      | `client_id` | `aaf6eff6-4c2c-44d1-b496-187d2cd2eb44` | ✅ | The Client ID issued in the **Partner Portal → Apps** page |
      | `redirect_uri` | `https://oauth.pstmn.io/v1/callback` | ✅ | Where Principle should send the user **and** the one-time `code`<br>✔️ Must exactly match one of the Redirect URIs saved for your app |
      | `scope` | `patients:read accounts:read appointments:read availability:read` | ✅ | Space-delimited list of scopes you're requesting |
      | `state` | `6fdb64ac-927a-4dce-b7d5-ec03c33980b9` | ✅ | A CSRF token you generate & store - verify the same value comes back |

      > [!tip] The Partner Portal has a **“Launch URL Generator”** on every app's Settings tab. Enter your `redirect_uri` & scopes and it crafts the full link for you, minus the state parameter.

      #### Example generated URL

      ```text
      https://principle.dental/oauth/authorize
        ?response_type=code
        &state=e4c19cf5-520e-4d3a-bd97-8931d8ab304a
        &client_id=cff3cfef-9743-480c-9615-c1b70375dc96
        &redirect_uri=https%3A%2F%2Foauth.pstmn.io%2Fv1%2Fcallback
        &scope=patients:read%20accounts:read%20appointments:read%20availability:read
      ```

      If the user **approves**, Principle redirects back to:

      ```
      https://oauth.pstmn.io/v1/callback?code=ab12cd…&state=e1bd0da8-9405-4ebd-9e16-c6e478ba7d0b
      ```

      Verify `state` then continue.

      <br />

      ## 2. Swap the code for tokens

      Retrieving a tokens is done via [POST `/v1/oauth/token`](#tag/oauth/POST/v1/oauth/token).

      ### **A. `authorization_code` grant**

      ```http
      POST /v1/oauth/token
      Content-Type: application/x-www-form-urlencoded

      grant_type=authorization_code
      &code=ab12cd…
      &redirect_uri=https://oauth.pstmn.io/v1/callback
      &client_id=bab2c6b4-b2fa-4223-8346-e853728852d5
      &client_secret=••••••••
      ```

      Successful `200 OK`:

      ```jsonc
      {
        "access_token":  "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
        "token_type":    "Bearer",
        "expires_in":    1200,            // ~20 minutes
        "refresh_token": "def50200…",
        "scope":         "patients:read accounts:read appointments:read availability:read"
      }
      ```

      Save both tokens securely.

      ### **B. `refresh_token` grant**

      When the access-token expires (API returns **401**):

      ```http
      POST /v1/oauth/token
      Content-Type: application/x-www-form-urlencoded

      grant_type=refresh_token
      &refresh_token=def50200…
      &client_id=4da3b6f2-5abb-4ed9-a768-076c92c57d5e
      &client_secret=••••••••
      ```

      You'll receive a **new** `access_token` (and sometimes a rotated `refresh_token`).

      <br />

      ## 3. Token lifetime & re-authorisation

      | Token | Lifetime | Renewal strategy |
      |-------|----------|------------------|
      | **Access-token** | **20 minutes** | Always replace via the **refresh-token** grant before calling the API |
      | **Refresh-token** | **2 months of inactivity** (rolling) | Any refresh or API call resets the 2-month clock.<br>If no activity for 2 months the next refresh returns `invalid_grant` → send the user through **/authorize** again |

      <br />

      ## 4. Error reference


      | HTTP | `error` | Fix |
      |------|---------|-----|
      | 400 | `invalid_request` | Missing / malformed parameter |
      | 400 | `invalid_grant` | Wrong / expired `code` or `refresh_token` |
      | 400 | `invalid_scope` | Scope not whitelisted for your app |
      | 401 | `invalid_client` | Wrong `client_id` / `client_secret` |
      | 401 | `invalid_token` | Access-token expired - refresh it |

      <br />

      ## 5. Putting it all together (pseudo-code)

      ```ts
      // 1️⃣  Send user to consent page
      if (!hasValidTokens()) {
        redirectUserTo(authorizeUrl(state));
      }

      // 2️⃣  Callback
      if (request.query.code) {
        const tokens = exchangeCodeForTokens(request.query.code);
        save(tokens);
        redirectToApp();
      }

      // 3️⃣  API wrapper
      async function callPrinciple(endpoint, opts) {
        try {
          return await fetchJson(endpoint, { ...opts, bearer: accessToken });
        } catch (e) {
          if (e.status === 401) {
            const tokens = await refreshTokens(refreshToken);
            save(tokens);
            return fetchJson(endpoint, { ...opts, bearer: tokens.access_token });
          }
          throw e;
        }
      }
      ```

      You now have everything you need for a robust OAuth integration with automatic token refresh and graceful re-authorisation when needed. **Happy building!**
servers:
  - url: https://api.principle.dental
    description: Production
  - url: https://api.staging.principle.dental
    description: Staging / Sandbox
  - url: https://api.dev.principle.dental
    description: Development
security:
  - apiKeyAuth: []
  - oauth2: []
tags:
  - name: Account Credits
    description: Endpoints for account credits & deposits
  - name: Appointments
    description: Endpoints related to appointment scheduling and queries
  - name: Availability
    description: Endpoints for checking appointment availability
  - name: Emails
    description: Endpoints for email messages
  - name: Files
    description: Endpoints for handling patient files (images, documents)
  - name: SMS Messages
    description: Endpoints for SMS messages
  - name: Interactions
    description: Endpoints for patient/appointment interactions (notes, calls)
  - name: Leads
    description: Endpoints for managing leads
  - name: Invoices
    description: Endpoints to retrieve invoice data
  - name: Notifications
    description: Endpoints for creating real-time popup notifications
  - name: OAuth
    description: Endpoints for OAuth 2.0 authentication
  - name: Patients
    description: Endpoints related to patient records and operations
  - name: Practices
    description: Endpoints for practice data
  - name: Practitioners
    description: Endpoints for practitioner data
  - name: Search
    description: Endpoints for searching availability, patients, and leads
  - name: Tags
    description: Endpoints for managing patient and appointment tags
  - name: Transactions
    description: Endpoints for payment transactions
  - name: Treatment Options
    description: Endpoints for listing and retrieving treatment options
  - name: Treatment Plans
    description: Endpoints for patient treatment plans, steps, and treatments
  - name: Webhooks
    description: Endpoints for managing webhook registrations
    x-displayName: Webhook Management
paths:
  /v1/oauth/authorize:
    get:
      tags:
        - OAuth
      operationId: authorize
      x-internal: true
      summary: OAuth 2.0 Authorize Endpoint
      description: |
        This endpoint is typically used in the Authorization Code Flow. The client app redirects the user to `/v1/oauth/authorize` along with query parameters like `client_id`, `redirect_uri`, `response_type=code`, and `scope`. The user then authenticates and grants access. If successful, the user is redirected back to the client's `redirect_uri` with a `code`.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: |
            The current Bearer token for the logged in user. This is used to determine the user and their organisation.
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
          description: Should be `code` for Authorization Code Flow.
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: true
          schema:
            type: string
          description: Space-separated list of scopes (e.g. `read write`).
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: |
            A random string to protect against CSRF attacks, returned by the server unchanged in the redirect.
        - name: organisationId
          in: query
          required: true
          schema:
            type: string
        - name: practiceIds
          in: query
          required: true
          description: |
            A list of practice IDs that the client is allowed to access.
          schema:
            type: array
            items:
              type: string
      responses:
        '302':
          description: |
            Redirects the user to the provided `redirect_uri` with a `code` parameter.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
  /v1/oauth/token:
    post:
      tags:
        - OAuth
      operationId: getToken
      summary: OAuth 2.0 Token Endpoint
      description: |
        Exchange an authorization code or client credentials for an access token. This endpoint supports **Authorization Code Flow** and **Client Credentials Flow**.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                  description: Specifies the OAuth2 flow.
                code:
                  type: string
                  description: Required if `grant_type=authorization_code`.
                client_id:
                  type: string
                  description: Your application's client ID.
                client_secret:
                  type: string
                  description: Your application's client secret.
                redirect_uri:
                  type: string
                  description: |
                    Required if `grant_type=authorization_code`, must match the original redirect_uri.
                scope:
                  type: string
                  description: Optional scopes, if applicable.
                refresh_token:
                  type: string
                  description: Required if `grant_type=refresh_token`.
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
              examples:
                default:
                  $ref: '#/components/examples/TokenSuccess'
        '400':
          description: Invalid request or credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidGrant:
                  $ref: '#/components/examples/OAuthInvalidGrantError'
                invalidClient:
                  $ref: '#/components/examples/OAuthInvalidClientError'
                invalidScope:
                  $ref: '#/components/examples/OAuthInvalidScopeError'
                unsupportedGrantType:
                  $ref: '#/components/examples/OAuthUnsupportedGrantTypeError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
  /v1/appointments:
    get:
      tags:
        - Appointments
        - Search
      operationId: listAppointmentsByDateRange
      summary: List appointments (all patients) by date range
      description: |
        Returns appointments whose **event.from** or **event.to** intersects the [from, to) window.
        Use this to report on the diary across **all patients**.
      security:
        - oauth2:
            - appointments:read
            - appointments:write
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - name: practitionerId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional status filter
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - $ref: '#/components/parameters/fromDateTime'
        - $ref: '#/components/parameters/toDateTime'
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offsetId'
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                default:
                  $ref: '#/components/examples/AppointmentList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/availability:
    get:
      tags:
        - Appointments
        - Availability
        - Search
      operationId: searchAvailability
      summary: Search availability for new appointments
      description: Search for available time slots when booking a new appointment. To search availability for rescheduling an existing appointment (via an appointment id), use the `searchRescheduleAvailability` endpoint (`GET /v1/patients/{patientId}/appointments/{appointmentId}/availability`).
      security:
        - oauth2:
            - availability:read
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - name: practitionerId
          in: query
          required: false
          schema:
            type: string
        - name: treatmentOptionId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Time slots available
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Availability'
              examples:
                default:
                  $ref: '#/components/examples/AvailabilityList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/files:
    get:
      tags:
        - Files
        - Search
      operationId: listFilesByDateRange
      summary: List patient files (all patients) by date range
      description: |
        Returns files across **all patients** filtered by creation and/or last-update window.
        At least one of the date filters must be supplied.
      security:
        - oauth2:
            - files:read
            - files:write
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offsetId'
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                default:
                  $ref: '#/components/examples/FileList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/invoices:
    get:
      tags:
        - Invoices
        - Search
      operationId: listInvoicesByDateRange
      summary: List invoices (all patients) by date range
      description: |
        Returns invoices created or updated within the supplied date range across all patients.
      security:
        - oauth2:
            - accounts:read
            - accounts:write
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offsetId'
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                default:
                  $ref: '#/components/examples/InvoiceList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/leads:
    get:
      tags:
        - Leads
        - Search
      operationId: searchLeads
      summary: Search leads
      description: |
        Search for leads by `name`/`phone`/`email` using semantic search. A limit of 10 results are returned.
      security:
        - oauth2:
            - patients:read
            - patients:write
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: phone
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful search
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
              examples:
                default:
                  $ref: '#/components/examples/LeadsList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Leads
      operationId: createLead
      summary: Create a new lead
      description: |
        Create a new lead. Captures caller information and the source interaction reference.
      security:
        - oauth2:
            - interactions:write
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
            examples:
              default:
                $ref: '#/components/examples/LeadCreate'
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/transactions:
    get:
      tags:
        - Transactions
        - Search
      operationId: listTransactionsByDateRange
      summary: List transactions (all patients) by date range
      description: |
        Returns transactions created or updated within the supplied date range across all patients.
      security:
        - oauth2:
            - accounts:read
            - accounts:write
        - apiKeyAuth: []
      parameters:
        - name: practiceId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/createdFrom'
        - $ref: '#/components/parameters/createdTo'
        - $ref: '#/components/parameters/updatedFrom'
        - $ref: '#/components/parameters/updatedTo'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offsetId'
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                default:
                  $ref: '#/components/examples/TransactionList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorisedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/notifications:
    post:
      tags:
        - Notifications
      operationId: createPopupNotification
      summary: Create a popup notification
      description: |
        Generates an in-app notifications for end-users inside Principle.

        A notification can include **actions** (buttons) which launch the relevant
        url.
      security:
